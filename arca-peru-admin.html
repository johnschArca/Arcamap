<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCA Admin — Peru Video Map</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F7F1E8;--dark:#1C0D06;--text:#2A1505;--muted:#6B4A30;
  --border:#D4B898;--green:#1D6B50;--amber:#D4A86A;--red:#C0392B;
  --surface:#fff;--f-disp:'Cormorant Garamond',serif;--f-body:'DM Sans',sans-serif;}
html,body{min-height:100%;font-family:var(--f-body);background:var(--bg);color:var(--text)}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.login-box{background:var(--dark);border-radius:4px;padding:2.5rem;width:100%;max-width:360px;text-align:center}
.login-title{font-family:var(--f-disp);font-size:1.8rem;color:#F5EDD5;margin-bottom:.35rem}
.login-title em{font-style:italic;color:var(--amber)}
.login-sub{font-size:.78rem;color:rgba(245,237,213,.35);margin-bottom:1.5rem;text-transform:uppercase;letter-spacing:.08em}
.login-input{width:100%;padding:.65rem 1rem;border:1px solid rgba(212,168,106,.3);border-radius:2px;
  background:rgba(255,255,255,.06);color:#F5EDD5;font-family:var(--f-body);font-size:.85rem;
  outline:none;margin-bottom:.75rem;text-align:center;letter-spacing:.1em}
.login-input::placeholder{color:rgba(245,237,213,.25)}
.login-input:focus{border-color:var(--amber)}
.login-btn{width:100%;padding:.7rem;background:var(--amber);color:var(--dark);
  border:none;border-radius:2px;font-family:var(--f-disp);font-size:1rem;
  font-weight:600;cursor:pointer;transition:background .15s}
.login-btn:hover{background:#c49558}
.login-error{color:#f87171;font-size:.78rem;margin-top:.5rem;display:none}

/* ADMIN UI */
.admin-wrap{display:none;flex-direction:column;min-height:100vh}
.admin-header{background:var(--dark);padding:.85rem 1.25rem;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;
  position:sticky;top:0;z-index:100}
.admin-logo{font-family:var(--f-disp);font-size:1.1rem;color:#F5EDD5}
.admin-logo em{font-style:italic;color:var(--amber)}
.admin-logo span{font-size:.65rem;color:rgba(245,237,213,.35);text-transform:uppercase;
  letter-spacing:.08em;display:block;margin-top:1px}
.hbtns{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{padding:.45rem .9rem;border-radius:2px;border:none;font-family:var(--f-body);
  font-size:.78rem;font-weight:500;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--amber);color:var(--dark)}
.btn-green{background:var(--green);color:white}
.btn-red{background:var(--red);color:white}
.btn-outline{background:transparent;color:rgba(245,237,213,.6);border:1px solid rgba(212,168,106,.3)}
.btn-sm{padding:.3rem .65rem;font-size:.72rem}
.btn:hover{opacity:.85}

.admin-body{flex:1;padding:1.25rem}

/* SEARCH SECTION */
.search-panel{background:var(--surface);border:1px solid var(--border);border-radius:3px;
  padding:1.25rem;margin-bottom:1.25rem}
.sp-title{font-family:var(--f-disp);font-size:1.2rem;margin-bottom:.85rem}
.sp-row{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:.6rem;align-items:end;flex-wrap:wrap}
@media(max-width:700px){.sp-row{grid-template-columns:1fr 1fr}}
.field label{font-size:.65rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:.4rem}
.field select,.field input{width:100%;padding:.5rem .8rem;border:1px solid var(--border);
  border-radius:2px;font-family:var(--f-body);font-size:.8rem;background:var(--bg);
  color:var(--text);outline:none}
.field select:focus,.field input:focus{border-color:var(--green)}
.progress{margin-top:.75rem;display:none}
.progress-bar{background:var(--bg);border:1px solid var(--border);border-radius:2px;height:5px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.progress-txt{font-size:.72rem;color:var(--muted);margin-bottom:.4rem}

/* STATS BAR */
.stats-bar{display:flex;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:3px;
  padding:.6rem 1rem;text-align:center;flex:1;min-width:80px}
.stat-n{font-family:var(--f-disp);font-size:1.4rem;color:var(--green)}
.stat-l{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* FILTERS */
.filters-row{display:flex;gap:.5rem;margin-bottom:.85rem;flex-wrap:wrap;align-items:center}
.fpill{padding:.28rem .75rem;border-radius:20px;font-size:.72rem;
  border:1px solid var(--border);background:transparent;color:var(--muted);
  cursor:pointer;font-family:var(--f-body);transition:all .15s}
.fpill.active{background:var(--dark);color:#F5EDD5;border-color:var(--dark)}
.fcount{font-size:.72rem;color:var(--muted);margin-left:auto}

/* VIDEO GRID */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.85rem}
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:3px;overflow:hidden;
  transition:box-shadow .15s}
.vcard:hover{box-shadow:0 3px 12px rgba(0,0,0,.08)}
.vcard.approved{border-color:var(--green)}
.vcard.rejected{opacity:.5}
.vc-thumb{position:relative;padding-top:56.25%;background:#111;cursor:pointer}
.vc-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vc-thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.3);opacity:0;transition:opacity .2s}
.vc-thumb:hover .play{opacity:1}
.play svg{width:40px;height:40px;fill:white}
.lang-badge{position:absolute;top:6px;right:6px;font-size:1rem;
  background:rgba(0,0,0,.6);border-radius:2px;padding:1px 5px}
.status-stripe{height:3px;width:100%}
.status-stripe.approved{background:var(--green)}
.status-stripe.pending{background:var(--amber)}
.status-stripe.rejected{background:var(--red)}
.vc-body{padding:.85rem}
.vc-title{font-size:.8rem;font-weight:500;color:var(--text);line-height:1.4;
  margin-bottom:.35rem;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.vc-loc{font-size:.7rem;color:var(--green);margin-bottom:.35rem}
.vc-meta{font-size:.68rem;color:var(--muted);margin-bottom:.65rem}
.vc-actions{display:flex;gap:.4rem;flex-wrap:wrap}

.empty{text-align:center;padding:3rem;color:var(--muted);grid-column:1/-1}
.empty h3{font-family:var(--f-disp);font-size:1.3rem;font-style:italic;margin-bottom:.5rem}
</style>
</head>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <div class="login-title">ARCA <em>Admin</em></div>
    <div class="login-sub">Peru Travel Video Map</div>
    <input class="login-input" type="password" id="pwd-input" placeholder="Enter password"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Access Admin Panel</button>
    <div class="login-error" id="login-error">Incorrect password. Try again.</div>
  </div>
</div>

<!-- ADMIN UI -->
<div class="admin-wrap" id="admin-wrap">
  <div class="admin-header">
    <div class="admin-logo">
      ARCA <em>Admin</em>
      <span>Peru Travel Video Map — Content Moderation</span>
    </div>
    <div class="hbtns">

      <button class="btn btn-red btn-sm" onclick="clearRejected()">🗑 Clear rejected</button>
      <button class="btn btn-primary btn-sm" onclick="exportCSV()">⬇ Export CSV</button>
      <button class="btn btn-outline btn-sm" onclick="viewPublicMap()">🗺 View public map</button>
      <button class="btn btn-outline btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="admin-body">
    <!-- SEARCH -->
    <div class="search-panel">
      <div class="sp-title">Search YouTube videos by location</div>
      <div class="sp-row">
        <div class="field">
          <label>Department</label>
          <select id="sel-dept" onchange="updateProvs()">
            <option value="">All departments</option>
          </select>
        </div>
        <div class="field">
          <label>Province / Location</label>
          <select id="sel-prov">
            <option value="">Select province</option>
          </select>
        </div>
        <div class="field">
          <label>Language</label>
          <select id="sel-lang">
            <option value="">All languages</option>
            <option value="en">🇬🇧 English</option>
            <option value="es">🇪🇸 Spanish</option>
            <option value="fr">🇫🇷 French</option>
            <option value="de">🇩🇪 German</option>
            <option value="it">🇮🇹 Italian</option>
          </select>
        </div>
        <div class="field" style="align-self:end">
          <button class="btn btn-primary" onclick="doSearch()">Search</button>
        </div>
        <div class="field" style="align-self:end">
          <button class="btn btn-outline" onclick="searchAllLocations()" title="Search all 221 locations">Search all</button>
        </div>
      </div>
      <div class="progress" id="progress">
        <div class="progress-txt" id="progress-txt">Searching…</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-bar">
      <div class="stat"><div class="stat-n" id="s-total">0</div><div class="stat-l">Total</div></div>
      <div class="stat"><div class="stat-n" id="s-pending">0</div><div class="stat-l">Pending</div></div>
      <div class="stat"><div class="stat-n" id="s-approved">0</div><div class="stat-l">Approved</div></div>
      <div class="stat"><div class="stat-n" id="s-rejected">0</div><div class="stat-l">Rejected</div></div>
      <div class="stat"><div class="stat-n" id="s-locations">0</div><div class="stat-l">Locations</div></div>
    </div>

    <!-- FILTERS -->
    <div class="filters-row">
      <button class="fpill active" onclick="setFilter('all',this)">All</button>
      <button class="fpill" onclick="setFilter('pending',this)">Pending</button>
      <button class="fpill" onclick="setFilter('approved',this)">Approved</button>
      <button class="fpill" onclick="setFilter('rejected',this)">Rejected</button>
      <button class="fpill" onclick="setFilter('en',this)">🇬🇧 EN</button>
      <button class="fpill" onclick="setFilter('es',this)">🇪🇸 ES</button>
      <button class="fpill" onclick="setFilter('fr',this)">🇫🇷 FR</button>
      <button class="fpill" onclick="setFilter('de',this)">🇩🇪 DE</button>
      <button class="fpill" onclick="setFilter('it',this)">🇮🇹 IT</button>
      <span class="fcount" id="fcount"></span>
    </div>

    <!-- VIDEO GRID -->
    <div class="vgrid" id="vgrid"></div>
  </div>
</div>

}
function doLogout(){
  document.getElementById('login-wrap').style.display='flex';
  document.getElementById('admin-wrap').style.display='none';
  document.getElementById('pwd-input').value='';
}

// ── INIT ──
function initAdmin(){
  try { allVideos = JSON.parse(localStorage.getItem('arca_all_videos')||'[]'); } catch(e){}
  syncApproved();
  renderGrid();

  // Populate dept select
  const depts = [...new Set(ALL_LOCATIONS.map(l=>l.dept))].sort();
  const ds = document.getElementById('sel-dept');
  depts.forEach(d=>{ const o=document.createElement('option');o.value=d;o.textContent=d;ds.appendChild(o);});
  updateProvs();
}

function updateProvs(){
  const dept = document.getElementById('sel-dept').value;
  const ps = document.getElementById('sel-prov');
  ps.innerHTML = '<option value="">All provinces</option>';
  ALL_LOCATIONS.filter(l=>!dept||l.dept===dept).forEach(l=>{
    const o=document.createElement('option');o.value=l.name;o.textContent=l.name;ps.appendChild(o);
  });
}

// ── LANGUAGE DETECTION ──
function detectLang(title, desc, reqLang){
  if(reqLang) return reqLang;
  const text = (title+' '+desc).toLowerCase();
  if(/\b(viaje|turismo|perú|lima|cusco|increíble|hermoso|ciudad|lugar)\b/.test(text)) return 'es';
  if(/\b(voyage|tourisme|magnifique|découverte|belle)\b/.test(text)) return 'fr';
  if(/\b(reise|sehenswürdigkeiten|schön|reisen|entdecken)\b/.test(text)) return 'de';
  if(/\b(viaggio|turismo|bellissimo|scoprire|meraviglioso)\b/.test(text)) return 'it';
  return 'en';
}

// ── YOUTUBE SEARCH ──
async function fetchYT(query, lang){
  const langParam = lang ? `&lang=${lang}` : '';
  const url = `${WORKER_URL}?q=${encodeURIComponent(query)}${langParam}`;
  const r = await fetch(url);
  const d = await r.json();
  return d.items||[];
}

async function doSearch(){
  const prov = document.getElementById('sel-prov').value;
  const dept = document.getElementById('sel-dept').value;
  const lang = document.getElementById('sel-lang').value;
  const locName = prov || dept;
  if(!locName){alert('Please select a department or province');return;}
  const loc = ALL_LOCATIONS.find(l=>l.name===locName) || ALL_LOCATIONS.find(l=>l.dept===dept);
  if(!loc) return;
  showProgress(true, `Searching: ${locName}…`, 50);
  try{
    const items = await fetchYT(loc.query+(lang?` language:${lang}`:''), lang);
    addVideos(items, loc, lang);
    showProgress(true, `Found ${items.length} videos for ${locName}`, 100);
    setTimeout(()=>showProgress(false),2000);
  }catch(e){ showProgress(true,'Error: '+e.message,100); }
  renderGrid();
}

async function searchAllLocations(){
  const lang = document.getElementById('sel-lang').value;
  showProgress(true,'Starting search…',0);
  for(let i=0;i<ALL_LOCATIONS.length;i++){
    const loc=ALL_LOCATIONS[i];
    showProgress(true,`${loc.name} (${i+1}/${ALL_LOCATIONS.length})`, Math.round((i+1)/ALL_LOCATIONS.length*100));
    try{
      const items = await fetchYT(loc.query, lang);
      addVideos(items, loc, lang);
      await new Promise(r=>setTimeout(r,350));
    }catch(e){console.warn(loc.name,e);}
  }
  showProgress(true,`Done — ${allVideos.length} videos found`,100);
  setTimeout(()=>showProgress(false),3000);
  renderGrid();
}

function addVideos(items, loc, reqLang){
  const newVids = items.map(item=>({
    id: item.id.videoId,
    title: item.snippet.title,
    thumb: item.snippet.thumbnails?.medium?.url||'',
    channel: item.snippet.channelTitle,
    published: item.snippet.publishedAt?.slice(0,10)||'',
    lang: detectLang(item.snippet.title, item.snippet.description||'', reqLang),
    location: loc.name, dept: loc.dept,
    lat: loc.lat, lon: loc.lon,
    status:'pending',
  })).filter(v=>v.id && !allVideos.find(e=>e.id===v.id));
  allVideos=[...allVideos,...newVids];
  saveAll();
}

function showProgress(show, txt='', pct=0){
  document.getElementById('progress').style.display=show?'block':'none';
  if(txt) document.getElementById('progress-txt').textContent=txt;
  document.getElementById('progress-fill').style.width=pct+'%';
}

// ── STATUS ──
function setStatus(id,status){
  const v=allVideos.find(v=>v.id===id);
  if(v){v.status=status;saveAll();syncApproved();renderGrid();}
}
function approveAll(){
  allVideos.filter(v=>v.status==='pending').forEach(v=>v.status='approved');
  saveAll();syncApproved();renderGrid();
}
function clearRejected(){
  allVideos=allVideos.filter(v=>v.status!=='rejected');
  saveAll();renderGrid();
}

// ── STORAGE ──
function saveAll(){
  try{localStorage.setItem('arca_all_videos',JSON.stringify(allVideos));}catch(e){}
  syncApproved();
}
function syncApproved(){
  const approved=allVideos.filter(v=>v.status==='approved');
  try{localStorage.setItem('arca_approved',JSON.stringify(approved));}catch(e){}
}

// ── RENDER ──
function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.fpill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function renderGrid(){
  updateStats();
  let filtered=allVideos;
  if(activeFilter==='pending') filtered=allVideos.filter(v=>v.status==='pending');
  else if(activeFilter==='approved') filtered=allVideos.filter(v=>v.status==='approved');
  else if(activeFilter==='rejected') filtered=allVideos.filter(v=>v.status==='rejected');
  else if(['en','es','fr','de','it'].includes(activeFilter)) filtered=allVideos.filter(v=>v.lang===activeFilter);

  document.getElementById('fcount').textContent=`${filtered.length} video${filtered.length!==1?'s':''}`;
  const grid=document.getElementById('vgrid');
  if(!filtered.length){
    grid.innerHTML=`<div class="empty"><h3>${allVideos.length?'No videos match this filter':'No videos yet'}</h3>
      <p>${allVideos.length?'Try a different filter':'Search for videos above to get started'}</p></div>`;
    return;
  }
  const flags={en:'🇬🇧',es:'🇪🇸',fr:'🇫🇷',de:'🇩🇪',it:'🇮🇹'};
  grid.innerHTML=filtered.map(v=>`
    <div class="vcard ${v.status}">
      <div class="vc-thumb" onclick="window.open('https://youtu.be/${v.id}','_blank')">
        <img src="${v.thumb}" loading="lazy" alt="">
        <div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <div class="lang-badge">${flags[v.lang]||'🌐'}</div>
      </div>
      <div class="status-stripe ${v.status}"></div>
      <div class="vc-body">
        <div class="vc-title">${v.title}</div>
        <div class="vc-loc">📍 ${v.location} · ${v.dept}</div>
        <div class="vc-meta">${v.channel} · ${v.published}</div>
        <div class="vc-actions">
          ${v.status!=='approved'?`<button class="btn btn-green btn-sm" onclick="setStatus('${v.id}','approved')">✅ Approve</button>`:''}
          ${v.status!=='rejected'?`<button class="btn btn-red btn-sm" onclick="setStatus('${v.id}','rejected')">❌ Reject</button>`:''}
          ${v.status!=='pending'?`<button class="btn btn-sm" style="background:var(--bg);border:1px solid var(--border)" onclick="setStatus('${v.id}','pending')">↩ Reset</button>`:''}
        </div>
      </div>
    </div>`).join('');
}

function updateStats(){
  document.getElementById('s-total').textContent=allVideos.length;
  document.getElementById('s-pending').textContent=allVideos.filter(v=>v.status==='pending').length;
  document.getElementById('s-approved').textContent=allVideos.filter(v=>v.status==='approved').length;
  document.getElementById('s-rejected').textContent=allVideos.filter(v=>v.status==='rejected').length;
  document.getElementById('s-locations').textContent=[...new Set(allVideos.map(v=>v.location))].length;
}

// ── EXPORT ──
function exportCSV(){
  const approved=allVideos.filter(v=>v.status==='approved');
  if(!approved.length){alert('No approved videos to export.');return;}
  const rows=[['id','title','channel','location','dept','lat','lon','lang','published','url']];
  approved.forEach(v=>rows.push([v.id,v.title,v.channel,v.location,v.dept,v.lat,v.lon,v.lang,v.published,`https://youtu.be/${v.id}`]));
  const csv=rows.map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='arca_peru_approved_videos.csv';a.click();
}

function viewPublicMap(){
  window.open('arca-peru-map-v2-public.html','_blank');
}
</script>
