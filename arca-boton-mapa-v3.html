<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; font-family: 'DM Sans', sans-serif; padding: 12px 0; }
  .wrap {
    display: flex; flex-wrap: wrap; align-items: center;
    justify-content: space-between; gap: 12px;
    background: #1C0D06; border-radius: 4px;
    padding: 14px 20px;
  }
  .info { color: rgba(245,237,213,.5); font-size: 12px; line-height: 1.5; }
  .info strong { display: block; color: #F5EDD5; font-size: 13px; margin-bottom: 2px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 10px 20px; border-radius: 3px;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    text-decoration: none; cursor: pointer; border: none;
    transition: all .15s; white-space: nowrap;
  }
  .btn-main { background: #C0392B; color: white; }
  .btn-main:hover { background: #a93226; }
  .btn-wa { background: #25D366; color: white; }
  .btn-wa:hover { background: #1da851; }
</style>
</head>
