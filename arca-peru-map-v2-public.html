<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peru Travel Videos — ARCA Network</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F1E8;--dark:#1C0D06;--text:#2A1505;--muted:#6B4A30;
  --border:#D4B898;--green:#1D6B50;--amber:#D4A86A;--red:#C0392B;
  --surface:#fff;--f-disp:'Cormorant Garamond',serif;--f-body:'DM Sans',sans-serif;
}
html,body{height:100%;font-family:var(--f-body);background:var(--dark);color:var(--text);overflow:hidden}

/* MAP FULL SCREEN */
#map{width:100%;height:100vh}

/* HEADER BAR */
.map-header{position:absolute;top:0;left:0;right:0;z-index:1000;
  background:var(--dark);padding:.7rem 1.1rem;
  display:flex;align-items:center;justify-content:space-between;gap:.75rem;
  border-bottom:1px solid rgba(255,255,255,.08)}
.hlogo{font-family:var(--f-disp);font-size:1.1rem;color:#F5EDD5;white-space:nowrap}
.hlogo em{font-style:italic;color:var(--amber)}
.hcontrols{display:flex;gap:.5rem;align-items:center;flex:1;justify-content:flex-end;flex-wrap:wrap}
.hselect{padding:.4rem .7rem;border:1px solid rgba(212,168,106,.3);border-radius:2px;
  font-family:var(--f-body);font-size:.75rem;background:rgba(255,255,255,.06);
  color:#F5EDD5;outline:none;max-width:220px}
.hselect option{background:#1C0D06;color:#F5EDD5}
.hselect optgroup{color:var(--amber)}
.hbtn{padding:.4rem .9rem;border-radius:2px;border:none;font-family:var(--f-body);
  font-size:.75rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.hbtn-primary{background:var(--amber);color:var(--dark)}
.hbtn-primary:hover{background:#c49558}
.hbtn-green{background:#25D366;color:white}
.hbtn-green:hover{background:#1da851}
.hbtn-outline{background:transparent;color:rgba(245,237,213,.6);
  border:1px solid rgba(212,168,106,.3)}
.hbtn-outline:hover{background:rgba(255,255,255,.08);color:#F5EDD5}

/* SIDEBAR */
.sidebar{position:absolute;right:0;top:48px;bottom:0;width:360px;z-index:999;
  background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform .25s ease;box-shadow:-4px 0 20px rgba(0,0,0,.15)}
.sidebar.open{transform:translateX(0)}
.sb-header{background:var(--dark);padding:.9rem 1.1rem;flex-shrink:0}
.sb-title{font-family:var(--f-disp);font-size:1.1rem;color:#F5EDD5;margin-bottom:2px}
.sb-sub{font-size:.65rem;color:rgba(245,237,213,.35);text-transform:uppercase;letter-spacing:.08em}
.sb-close{position:absolute;top:.75rem;right:.9rem;background:none;border:none;
  color:rgba(245,237,213,.4);font-size:1.2rem;cursor:pointer;z-index:1}
.sb-body{flex:1;overflow-y:auto;padding:.9rem}
.sb-body::-webkit-scrollbar{width:3px}
.sb-body::-webkit-scrollbar-thumb{background:var(--border)}

/* VIDEO ITEMS */
.vi{margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--bg)}
.vi:last-child{border-bottom:none}
.vi-thumb{width:100%;padding-top:56.25%;position:relative;border-radius:2px;
  overflow:hidden;background:#111;margin-bottom:.55rem;cursor:pointer}
.vi-thumb img,.vi-thumb iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:none}
.vi-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.25);transition:opacity .2s}
.vi-thumb:hover .vi-play{opacity:0}
.vi-play svg{width:40px;height:40px;fill:white;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.vi-title{font-size:.8rem;font-weight:500;color:var(--text);line-height:1.4;margin-bottom:.3rem}
.vi-meta{font-size:.68rem;color:var(--muted);display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;font-size:.62rem;padding:1px 6px;border-radius:2px;font-weight:500}
.badge-en{background:#dbeafe;color:#1e40af}
.badge-es{background:#fef9c3;color:#854d0e}
.badge-fr{background:#fce7f3;color:#9d174d}
.badge-de{background:#ecfdf5;color:#065f46}
.badge-it{background:#fff7ed;color:#9a3412}
.badge-other{background:#f3f4f6;color:#374151}

/* PLACEHOLDER */
.placeholder{text-align:center;padding:3rem 1rem;color:var(--muted)}
.placeholder h3{font-family:var(--f-disp);font-size:1.3rem;font-style:italic;margin-bottom:.5rem}
.placeholder p{font-size:.8rem;line-height:1.6}

/* LOADING TOAST */
.toast{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);
  background:var(--dark);color:#F5EDD5;padding:.6rem 1.25rem;border-radius:3px;
  font-size:.8rem;z-index:2000;display:none;white-space:nowrap;
  border:1px solid rgba(212,168,106,.2);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast.show{display:block}

/* FULLSCREEN */
:-webkit-full-screen #map{height:100vh}
:fullscreen #map{height:100vh}

/* Leaflet popup */
.leaflet-popup-content-wrapper{border-radius:3px!important;border:1px solid var(--border)!important;
  box-shadow:0 4px 16px rgba(28,13,6,.2)!important;padding:0!important}
.leaflet-popup-content{margin:0!important}
.popup-box{font-family:var(--f-body);padding:10px 13px;min-width:150px}
.popup-name{font-family:var(--f-disp);font-size:1rem;font-weight:600;color:#2A1505;margin-bottom:2px}
.popup-count{font-size:.7rem;color:#6B4A30}
.popup-dept{font-size:.65rem;color:#D4A86A;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}

@media(max-width:600px){
  .sidebar{width:100%;top:48px}
  .hselect{max-width:140px;font-size:.7rem}
}
</style>
</head>

<div class="map-header">

</div>

<!-- MAP -->
<div id="map" style="padding-top:48px"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

    </div>

</div>

<div class="toast" id="toast"></div>

    const m = L.marker([loc.lat, loc.lon], {icon}).addTo(mapInstance);
    const langCounts = {en:0,es:0,fr:0,de:0,it:0};
    locVids.forEach(v => { if(langCounts[v.lang]!==undefined) langCounts[v.lang]++; });
    const flags = Object.entries(langCounts).filter(([,n])=>n>0)
      .map(([l,n])=>`${{en:'🇬🇧',es:'🇪🇸',fr:'🇫🇷',de:'🇩🇪',it:'🇮🇹'}[l]}${n}`).join(' ');

    m.bindPopup(`<div class="popup-box">
      <div class="popup-dept">${loc.dept}</div>
      <div class="popup-name">${loc.name}</div>
      <div class="popup-count">${count>0?`${count} video${count>1?'s':''} · ${flags}`:'No videos yet — click to search'}</div>
    </div>`);

    m.on('click', () => openLocation(loc, locVids));
    markers[loc.name] = m;
  });
}

renderPins();

// OPEN LOCATION SIDEBAR
function openLocation(loc, videos) {
  currentLoc = loc;
  document.getElementById('sb-title').textContent = loc.name;
  document.getElementById('sb-sub').textContent = loc.dept + ' · ' + (videos.length || 'No') + ' video' + (videos.length!==1?'s':'');
  document.getElementById('sidebar').classList.add('open');

  const langFilter = document.getElementById('sel-lang-filter').value;
  const filtered = langFilter ? videos.filter(v=>v.lang===langFilter) : videos;

  if (!filtered.length) {
    document.getElementById('sb-body').innerHTML = `
      <div class="placeholder">
        <h3>${loc.name}</h3>
        <p>No travel videos yet for this location${langFilter?' in the selected language':''}.</p>
        <p style="margin-top:.75rem;font-size:.75rem;color:var(--amber)">
          Admin: <a href="arca-peru-admin.html" style="color:var(--amber)">Add videos here</a>
        </p>
      </div>`;
    return;
  }

  document.getElementById('sb-body').innerHTML = filtered.map(v => `
    <div class="vi">
      <div class="vi-thumb" onclick="embedVideo(this,'${v.id}')">
        <img src="${v.thumb}" alt="${v.title}" loading="lazy">
        <div class="vi-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
      <div class="vi-title">${v.title}</div>
      <div class="vi-meta">
        <span class="badge badge-${v.lang}">${langFlag(v.lang)}</span>
        <span>${v.channel}</span>
        <span>${v.published||''}</span>
      </div>
    </div>`).join('');
}

function langFlag(l){
  const m={en:'🇬🇧 EN',es:'🇪🇸 ES',fr:'🇫🇷 FR',de:'🇩🇪 DE',it:'🇮🇹 IT'};
  return m[l]||'🌐 Other';
}

function embedVideo(el,id){
  el.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1"
    allow="autoplay;encrypted-media" allowfullscreen></iframe>`;
}

function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); }

function filterByDept(){
  const d = document.getElementById('sel-dept').value;
  renderPins(d);
  if(d) { const loc=ALL_LOCATIONS.find(l=>l.dept===d&&l.isDept); if(loc) mapInstance.setView([loc.lat,loc.lon],7); }
  else mapInstance.setView([-9.19,-75.0],5);
}

document.getElementById('sel-lang-filter').addEventListener('change',()=>{
  renderPins(document.getElementById('sel-dept').value);
  if(currentLoc){
    const vids = approvedVideos.filter(v=>v.location===currentLoc.name);
    openLocation(currentLoc, vids);
  }
});

// FULLSCREEN
const mapEl = document.getElementById('map');
function toggleFullscreen(){
  if(!document.fullscreenElement) mapEl.requestFullscreen().then(()=>setTimeout(()=>mapInstance.invalidateSize(),200));
  else document.exitFullscreen().then(()=>setTimeout(()=>mapInstance.invalidateSize(),200));
}
document.addEventListener('fullscreenchange',()=>setTimeout(()=>mapInstance.invalidateSize(),200));

// SHARE
function shareMap(){
  const url = window.location.href;
  const text = '🗺 Discover Peru through the eyes of real travelers — ARCA Network Travel Map\n' + url;
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}

// TOAST
function showToast(msg, ms=2500){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),ms);
}

window.addEventListener('resize',()=>mapInstance.invalidateSize());
</script>
